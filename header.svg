<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 420" width="896" height="420" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <defs>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#0ea5e9" stop-opacity="0.5"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#ec4899" stop-opacity="0.4"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="g4"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="frost" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="panel"><rect x="48" y="44" width="800" height="332" rx="30"/></clipPath>
  </defs>

  <!-- 深色底 + 彩色光斑 -->
  <rect width="896" height="420" fill="#0b0f1a"/>
  <g id="blobs">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 -10; 0 0" dur="16s" repeatCount="indefinite"/>
      <circle cx="180" cy="90" r="150" fill="url(#g1)" filter="url(#soft)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -12 12; 0 0" dur="20s" repeatCount="indefinite"/>
      <circle cx="720" cy="120" r="160" fill="url(#g2)" filter="url(#soft)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 10 8; 0 0" dur="18s" repeatCount="indefinite"/>
      <circle cx="500" cy="360" r="140" fill="url(#g3)" filter="url(#soft)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -8 -8; 0 0" dur="22s" repeatCount="indefinite"/>
      <circle cx="60" cy="330" r="110" fill="url(#g4)" filter="url(#soft)"/>
    </g>
  </g>

  <!-- 磨砂玻璃面板：模糊背景 + 半透明白 + 噪点霜面 -->
  <g clip-path="url(#panel)">
    <use href="#blobs" filter="url(#frost)"/>
    <rect x="48" y="44" width="800" height="332" fill="#ffffff" opacity="0.055"/>
    <rect x="48" y="44" width="800" height="332" filter="url(#noise)" opacity="0.05"/>
  </g>
  <rect x="48" y="44" width="800" height="332" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- 顶部高光描边 -->
  <path d="M 84 47 H 812" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>

  <!-- 头像 -->
  <circle cx="150" cy="158" r="58" fill="#0b0f1a" stroke="url(#ring)" stroke-width="4"/>
  <text x="150" y="182" text-anchor="middle" font-size="52" font-weight="700" fill="url(#txt)">V</text>

  <!-- 名字 + 标语 -->
  <text x="236" y="152" font-size="54" font-weight="800" fill="url(#txt)">Vaga8ond</text>
  <text x="238" y="186" font-size="19" fill="#e2e8f0" fill-opacity="0.85">Code is a journey, not a destination.</text>
  <text x="238" y="214" font-size="16" fill="#94a3b8">流浪的工程师 · 在路上的写码人</text>

  <!-- 玻璃小胶囊 -->
  <g font-size="14.5">
    <rect x="236" y="244" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="254" y="266">⚛️ React</text>
    <rect x="364" y="244" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="382" y="266">🟦 TypeScript</text>
    <rect x="502" y="244" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="520" y="266">🟨 Node.js</text>
    <rect x="630" y="244" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="648" y="266">🐳 Docker</text>
    <rect x="236" y="292" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="254" y="314">🐍 Python</text>
    <rect x="354" y="292" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="372" y="314">🟢 Vue / Nuxt</text>
    <rect x="492" y="292" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="510" y="314">🗄️ MySQL</text>
    <rect x="620" y="292" width="122" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="638" y="314">☁️ Git / CI</text>
  </g>

  <!-- 底部小字 -->
  <text x="448" y="360" text-anchor="middle" font-size="13" fill="#64748b">Vaga8ond/Vaga8ond — 磨砂玻璃 · Frosted Glass</text>
</svg>
